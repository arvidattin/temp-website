<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Den Första Nyckeln</title>
  <meta name="description" content="Ni har hittat den första nyckeln. Men vissa skatter hittas först när tiden är mogen.">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Dark ambient background layers -->
  <div class="bg-gradient"></div>
  <canvas id="ambientCanvas"></canvas>
  <div class="vignette"></div>

  <!-- COUNTDOWN SCREEN -->
  <main class="container" id="countdownScreen">
    <div class="content-wrapper">
      <h1 class="main-quote">
        Ni har hittat den första nyckeln. Men vissa skatter hittas först när tiden är mogen.
      </h1>

      <div class="countdown-container" id="countdown">
        <div class="timer-unit">
          <div class="card-wrapper">
            <span class="number" id="days">00</span>
          </div>
        </div>

        <div class="colon">:</div>

        <div class="timer-unit">
          <div class="card-wrapper">
            <span class="number" id="hours">00</span>
          </div>
        </div>

        <div class="colon">:</div>

        <div class="timer-unit">
          <div class="card-wrapper">
            <span class="number" id="minutes">00</span>
          </div>
        </div>

        <div class="colon">:</div>

        <div class="timer-unit">
          <div class="card-wrapper">
            <span class="number" id="seconds">00</span>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- REVEAL SCREEN (hidden until countdown ends) -->
  <div id="revealScreen" class="reveal-screen hidden">
    <!-- Full-screen map image with pan/zoom -->
    <div id="imageViewport" class="image-viewport">
      <img id="mainImage" src="images/all.png" alt="Kartan" draggable="false" />
    </div>


    <!-- Key icon – restore popup -->
    <button id="keyToggleBtn" class="key-toggle-btn" title="Visa/dölj nyckeln" aria-label="Visa nyckeln">
      <!-- SVG key icon -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="7.5" cy="15.5" r="4.5"/>
        <path d="M21 2l-9.6 9.6"/>
        <path d="M15.5 7.5l3 3L22 7l-3-3"/>
      </svg>
    </button>

    <!-- Key popup panel -->
    <div id="keyPopup" class="key-popup">
      <div class="key-popup-header">
        <span class="key-popup-title">Nyckeln</span>
        <button id="closeKeyPopup" class="key-popup-close" title="Minimera" aria-label="Minimera nyckeln">&#8212;</button>
      </div>
      <div class="key-popup-body">
        <img id="keyImage" src="images/key.jpg" alt="Nyckeln" draggable="false" />
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
